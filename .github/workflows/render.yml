name: Render MomentWire Batch

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: MomentWire creative batch ID
        required: true
        type: string
      expected_sha256:
        description: Exact approved source SHA-256
        required: true
        type: string
      expected_bytes:
        description: Exact approved source byte size
        required: true
        type: string
      hook:
        description: Source-grounded hook text
        required: true
        type: string
      quality_floor:
        description: Minimum accepted quality score
        required: true
        default: "90"
        type: string

permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [hook-first, reaction-led]
    env:
      SOURCE_URL: ${{ secrets.MW_SOURCE_URL }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      EXPECTED_BYTES: ${{ inputs.expected_bytes }}
      HOOK: ${{ inputs.hook }}
      BATCH_ID: ${{ inputs.batch_id }}
      QUALITY_FLOOR: ${{ inputs.quality_floor }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow opencv-python-headless
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Fetch exact approved source
        run: |
          test -n "$SOURCE_URL"
          curl -fsSL --retry 3 --retry-delay 2 "$SOURCE_URL" -o source.mp4
          ACTUAL_BYTES="$(stat -c %s source.mp4)"
          ACTUAL_SHA256="$(sha256sum source.mp4 | awk '{print $1}')"
          echo "source_bytes=$ACTUAL_BYTES"
          echo "source_sha256=$ACTUAL_SHA256"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          ffprobe -v error -show_entries stream=codec_type,width,height \
            -show_entries format=duration -of json source.mp4

      - name: Render and QA variant
        run: |
          mkdir -p output
          python scripts/render_variant.py \
            --source source.mp4 \
            --output "output/${VARIANT}.mp4" \
            --variant "$VARIANT" \
            --hook "$HOOK" \
            --batch-id "$BATCH_ID"
          SCORE="$(python -c "import json; print(json.load(open('output/${VARIANT}.json'))['quality_rubric']['computed_score'])")"
          python -c "import sys; sys.exit(0 if float('$SCORE') >= float('$QUALITY_FLOOR') else 1)"
      - name: Upload verified variant
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ inputs.batch_id }}-${{ matrix.variant }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
